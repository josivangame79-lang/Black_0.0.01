name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: |
          unzip -q BlackAI_4.0_projeto.zip -d extraido
          cd extraido/BlackAI
          # Gera o gradle-wrapper.jar que está faltando
          gradle wrapper --gradle-version 8.9

      - name: Compilar APK
        working-directory: extraido/BlackAI
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackAI-APK
          path: extraido/BlackAI/app/build/outputs/apk/debug/*.apk