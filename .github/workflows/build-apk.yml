name: build-apk

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair projeto
        run: unzip -q BlackAI_4.0_projeto.zip -d extraido

      - name: Compilar APK
        working-directory: extraido/BlackAI
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BlackAI-APK
          path: extraido/BlackAI/app/build/outputs/apk/debug/*.apk
